<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CD Lister</title>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--mut:#666;--line:#ddd;--acc:#2a5bd7;--card:#f6f6f6;--err:#c62828;--ok:#2e7d32}
@media(prefers-color-scheme:dark){:root{--bg:#161616;--fg:#eee;--mut:#999;--line:#333;--acc:#6d9bff;--card:#212121;--err:#ef6c6c;--ok:#66bb6a}}
*{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif;background:var(--bg);color:var(--fg);padding:20px;max-width:1200px;margin:auto}
h1{font-size:20px;margin:0 0 16px}
#drop{border:2px dashed var(--line);border-radius:10px;padding:28px;text-align:center;color:var(--mut);cursor:pointer;background:var(--card)}
#drop.over{border-color:var(--acc)}
.bar{display:flex;gap:10px;align-items:center;margin:16px 0;flex-wrap:wrap}
button{background:var(--acc);color:#fff;border:0;border-radius:6px;padding:8px 14px;cursor:pointer;font:inherit}
button.sec{background:var(--card);color:var(--fg);border:1px solid var(--line)}
table{width:100%;border-collapse:collapse}th,td{padding:4px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--mut);font-weight:500;font-size:12px}
td input,td select{width:100%;background:transparent;color:var(--fg);border:1px solid transparent;border-radius:4px;padding:5px;font:inherit}
td input:focus,td select:focus{border-color:var(--acc);outline:0}
td select option{background:var(--bg)}
.st{font-size:12px}.st.error{color:var(--err)}.st.listed,.st.offer{color:var(--ok)}
.upload{display:inline-block;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:5px 8px;cursor:pointer;white-space:nowrap}
.low{background:rgba(255,170,0,.12)}
#msg{color:var(--mut)}
</style></head><body>
<h1>CD Lister</h1>
<div id="drop">Drop a photo of your CDs here, or click to choose<input id="f" type="file" accept="image/*" hidden multiple></div>
<div class="bar">
  <label>Set price for selected £ <input id="bulk" type="number" step="0.01" style="width:80px"></label>
  <button class="sec" onclick="bulk()">Apply</button>
  <span style="flex:1"></span>
  <label><input type="checkbox" id="pub"> Publish live (otherwise saves as unpublished offer)</label>
  <button onclick="pushSel()">Push selected to eBay</button>
</div>
<div id="msg"></div>
<table><thead><tr><th><input type="checkbox" id="all" onchange="toggleAll()"></th><th>Artist</th><th>Title</th><th>Year</th><th>Label</th><th>Cat no</th><th>Condition</th><th>£</th><th>Cover</th><th>Status</th><th></th></tr></thead>
<tbody id="rows"></tbody></table>
<script>
const $=s=>document.querySelector(s);let items=[];
const CONDS={LIKE_NEW:"Like new",USED_VERY_GOOD:"Very good",USED_GOOD:"Good",USED_ACCEPTABLE:"Acceptable"};
const msg=t=>$("#msg").textContent=t;
async function load(){items=await (await fetch("/api/items")).json();render()}
function render(){
 $("#rows").innerHTML=items.map(i=>`<tr class="${i.confidence!=null&&i.confidence<.6?'low':''}">
 <td><input type="checkbox" class="sel" value="${i.id}" ${i.status=='listed'?'disabled':''}></td>
 ${["artist","title","year","label","catno"].map(k=>`<td><input value="${esc(i[k])}" onchange="save(${i.id},'${k}',this.value)"></td>`).join("")}
 <td><select onchange="save(${i.id},'condition',this.value)">${Object.entries(CONDS).map(([v,l])=>`<option value="${v}" ${v==i.condition?'selected':''}>${l}</option>`).join("")}</select></td>
 <td style="width:80px"><input type="number" step="0.01" value="${i.price}" onchange="save(${i.id},'price',+this.value)"></td>
 <td><label class="upload">${i.cover_path?"Replace cover":"Add cover"}<input type="file" accept="image/*" hidden onchange="uploadCover(${i.id},this)"></label></td>
 <td class="st ${i.status}" title="${esc(i.error)}">${i.status}${i.error?' ⚠':''}</td>
 <td><button class="sec" onclick="del(${i.id})">✕</button></td></tr>`).join("")}
const esc=s=>String(s??"").replace(/"/g,"&quot;").replace(/</g,"&lt;");
const save=(id,k,v)=>fetch("/api/items/"+id,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({[k]:v})});
const del=async id=>{await fetch("/api/items/"+id,{method:"DELETE"});load()};
const sel=()=>[...document.querySelectorAll(".sel:checked")].map(e=>+e.value);
const toggleAll=()=>document.querySelectorAll(".sel:not(:disabled)").forEach(e=>e.checked=$("#all").checked);
async function bulk(){const p=+$("#bulk").value;if(!p)return;for(const id of sel())await save(id,"price",p);load()}
async function uploadCover(id,input){const file=input.files[0];if(!file)return;
 msg(`Uploading cover for #${id}…`);const fd=new FormData();fd.append("file",file);
 const r=await fetch(`/api/items/${id}/cover`,{method:"POST",body:fd});const j=await r.json();
 msg(r.ok?`Custom cover saved for #${id}`:(j.detail||"Could not save cover image"));input.value="";load()}
async function pushSel(){const ids=sel();if(!ids.length)return msg("Select some rows first");
 if($("#pub").checked&&!confirm(`Publish ${ids.length} live listing(s) on eBay?`))return;
 msg(`Pushing ${ids.length}… (about 3s each)`);
 const r=await (await fetch("/api/push",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({ids,publish:$("#pub").checked})})).json();
 const failed=r.filter(x=>x.status=="error");
 const reasons=failed.map(x=>`#${x.id}: ${x.error||"Unknown eBay error"}`).join(" | ");
 msg(`Done: ${r.length-failed.length} ok, ${failed.length} failed${reasons?`. ${reasons}`:""}`);load()}
async function up(files){for(const f of files){msg("Identifying "+f.name+"…");const fd=new FormData();fd.append("file",f);
 const r=await fetch("/api/upload",{method:"POST",body:fd});const j=await r.json();
 msg(r.ok?(j.cached?"Already processed that photo (no AI call made)":`Found ${j.added} CDs`):(j.detail||"Error"));}load()}
$("#drop").onclick=()=>$("#f").click();$("#f").onchange=e=>up(e.target.files);
$("#drop").ondragover=e=>{e.preventDefault();$("#drop").classList.add("over")};
$("#drop").ondragleave=()=>$("#drop").classList.remove("over");
$("#drop").ondrop=e=>{e.preventDefault();$("#drop").classList.remove("over");up(e.dataTransfer.files)};
load();
</script></body></html>
